# Application
quarkus.package.jar.type=uber-jar
quarkus.application.name=jesoos
quarkus.http.port=38797
quarkus.http.limits.max-body-size=100M
quarkus.devservices.enabled=false
# Auto-reload off: a hot reload rebuilds the CDI context and silently wipes the in-memory
# stream pools and their vertx timers mid-run (a live OTS loses its agenda and all pending
# scenes, emitting no metric at all). Restart jesoos by hand to pick up code changes.
quarkus.live-reload.enabled=false

quarkus.index-dependency.2next.group-id=com.semantyca
quarkus.index-dependency.2next.artifact-id=2next
quarkus.arc.exclude-types=com.semantyca.core.jwt.JWTCallerPrincipalFactory,io.smallrye.jwt.auth.cdi.JWTCallerPrincipalFactoryProducer

# Logging
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Scheduler
quarkus.scheduler.enabled=true

# Health Checks
quarkus.smallrye-health.enabled=true

# Optionally disable Dev UI entirely (comment out if you want Dev UI)
# quarkus.devui.enabled=false

# Dedicated chat communication logger — set DEBUG for full detail
quarkus.log.category."jesoos.chat".level=INFO

# Suppress verbose FFmpeg wrapper output
quarkus.log.category."net.bramp.ffmpeg".level=WARN
quarkus.log.category."net.bramp.ffmpeg.builder".level=ERROR
quarkus.log.category."net.bramp.ffmpeg.RunProcessFunction".level=ERROR
