# Application
quarkus.package.jar.type=uber-jar
quarkus.application.name=jesoos
quarkus.http.port=38797
quarkus.devservices.enabled=false

quarkus.index-dependency.2next.group-id=io.kneo
quarkus.index-dependency.2next.artifact-id=2next

# Logging
quarkus.log.level=INFO

# Scheduler
quarkus.scheduler.enabled=true

# Health Checks
quarkus.smallrye-health.enabled=true

# Optionally disable Dev UI entirely (comment out if you want Dev UI)
# quarkus.devui.enabled=false

# Suppress verbose FFmpeg wrapper output
quarkus.log.category."net.bramp.ffmpeg".level=WARN
quarkus.log.category."net.bramp.ffmpeg.builder".level=ERROR
quarkus.log.category."net.bramp.ffmpeg.RunProcessFunction".level=ERROR

# Mailer
quarkus.mailer.host=smtp.example.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=change-me
quarkus.mailer.password=change-me
quarkus.mailer.from=noreply@jesoos.app
jesoos.from-address=noreply@jesoos.app

# Keycloak
keycloak.url=https://keycloak.example.com
keycloak.realm=change-me
keycloak.client-id=jesoos-app
keycloak.client-secret=change-me
