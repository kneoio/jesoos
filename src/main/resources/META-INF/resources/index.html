<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesoos · Stream Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a1a;
            --surface: #2a2a2a;
            --surface2: #1f1f1f;
            --border: #333333;
            --border-bright: #444444;
            --accent: #2196F3;
            --accent2: #42A5F5;
            --accent3: #fa6d6d;
            --amber: #f5a623;
            --purple: #b084ff;
            --green: #34d399;
            --text: #f0f0f0;
            --text-muted: #b0b0b0;
            --text-dim: #808080;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'Space Grotesk', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
        }

        .sidebar {
            grid-row: 1 / 3;
            border-right: 1px solid var(--border);
            padding: 32px 0;
            display: flex;
            flex-direction: column;
            background: rgba(13,13,26,0.7);
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo {
            padding: 0 24px 32px;
            border-bottom: 1px solid var(--border);
        }

        .logo-text {
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .logo-sub {
            font-family: var(--mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .sidebar-section {
            padding: 24px;
        }

        .section-label {
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .select-wrap select {
            width: 100%;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--accent2);
            background: var(--surface2);
            border: 1px solid var(--border-bright);
            border-radius: 3px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .status-indicator {
            margin-top: auto;
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-dot.running {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .topbar {
            grid-column: 2;
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8,8,16,0.8);
        }

        .topbar-title {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .main {
            grid-column: 2;
            padding: 32px;
        }

        .actions-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid;
            background: transparent;
        }

        .action-btn.primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .action-btn.primary:hover {
            background: rgba(33,150,243,0.12);
        }

        .action-btn.secondary {
            border-color: var(--border-bright);
            color: var(--text-muted);
        }

        .action-btn.secondary:hover {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .result-panel {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: var(--surface);
            margin-bottom: 24px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,8,16,0.5);
        }

        .panel-title {
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .panel-badge {
            font-family: var(--mono);
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 2px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .panel-badge.ok {
            color: var(--accent);
            background: rgba(33,150,243,0.1);
            border: 1px solid rgba(33,150,243,0.25);
        }

        .panel-badge.err {
            color: var(--accent3);
            background: rgba(250,109,109,0.1);
            border: 1px solid rgba(250,109,109,0.25);
        }

        .panel-badge.pending {
            color: var(--amber);
            background: rgba(245,166,35,0.1);
            border: 1px solid rgba(245,166,35,0.25);
        }

        .panel-body {
            padding: 16px;
            background: var(--surface2);
        }

        .panel-empty {
            padding: 32px;
            text-align: center;
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* AGENDA HEADER */
        .agenda-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .agenda-stats {
            display: flex;
            gap: 24px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-family: var(--mono);
            font-size: 0.55rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: var(--mono);
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 600;
        }

        /* SCENE CARDS - Metriq Style */
        .scenes-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .scene-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: var(--surface);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .scene-card:hover {
            border-color: var(--border-bright);
        }

        .scene-card.expanded {
            border-color: var(--accent2);
        }

        .scene-row {
            display: grid;
            grid-template-columns: max-content max-content 1fr max-content max-content auto;
            align-items: center;
            gap: 20px;
            padding: 12px 16px;
            min-height: 48px;
        }

        .scene-time {
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent2);
            min-width: 50px;
        }

        .scene-type-badge {
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 3px;
            text-align: center;
            border: 1px solid;
            white-space: nowrap;
            min-width: 80px;
            text-transform: uppercase;
        }

        .scene-type-badge.music {
            color: var(--accent);
            background: rgba(33,150,243,0.08);
            border-color: rgba(33,150,243,0.2);
        }

        .scene-type-badge.news {
            color: var(--purple);
            background: rgba(176,132,255,0.08);
            border-color: rgba(176,132,255,0.2);
        }

        .scene-type-badge.weather {
            color: var(--green);
            background: rgba(52,211,153,0.08);
            border-color: rgba(52,211,153,0.2);
        }

        .scene-type-badge.greeting {
            color: var(--amber);
            background: rgba(245,166,35,0.08);
            border-color: rgba(245,166,35,0.2);
        }

        .scene-title {
            font-size: 0.9rem;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scene-duration {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .scene-songs {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 3px 10px;
            border-radius: 3px;
            border: 1px dashed rgba(255,255,255,0.12);
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
        }

        .chevron-cell {
            color: var(--text-dim);
            font-size: 0.9rem;
            transition: transform 0.2s;
            width: 20px;
            text-align: center;
        }

        .scene-card.expanded .chevron-cell {
            transform: rotate(90deg);
        }

        .scene-payload {
            overflow: hidden;
            height: 0;
            border-top: 0 solid var(--border);
        }

        .scene-payload.open {
            border-top-width: 1px;
        }

        .payload-inner {
            padding: 16px;
            background: var(--surface2);
        }

        .payload-meta {
            display: flex;
            gap: 24px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .meta-pair {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-key {
            font-family: var(--mono);
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .meta-val {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .payload-json-wrap {
            position: relative;
        }

        .payload-json {
            background: #080810;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: #a8b3cf;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 260px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 1px;
            background: var(--surface2);
            border: 1px solid var(--border-bright);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
        }

        .copy-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* FULL JSON DUMP EXPANDABLE */
        .json-dump-section {
            margin-top: 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: var(--surface);
        }

        .json-dump-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(8,8,16,0.5);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .json-dump-header:hover {
            background: rgba(8,8,16,0.8);
        }

        .json-dump-title {
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .json-dump-chevron {
            color: var(--text-dim);
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        .json-dump-section.expanded .json-dump-chevron {
            transform: rotate(90deg);
        }

        .json-dump-body {
            overflow: hidden;
            height: 0;
            background: var(--surface2);
        }

        .json-dump-body.open {
            height: auto;
        }

        .json-dump-inner {
            padding: 16px;
        }

        pre.json-code {
            background: #080810;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: #a8b3cf;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
            margin: 0;
        }

        .spinner {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 1px solid var(--border-bright);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-text">jesoos</div>
            <div class="logo-sub">stream control</div>
        </div>
        <div class="sidebar-section">
            <div class="section-label">Brand</div>
            <div class="select-wrap">
                <select id="brand">
                    <option value="lumisonic">lumisonic</option>
                    <option value="sacana">sacana</option>
                    <option value="em07chat">em07chat</option>
                    <option value="malucra">malucra</option>
                    <option value="bratan">bratan</option>
                    <option value="sunonation">sunonation</option>
                    <option value="mixplaclone">mixplaclone</option>
                    <option value="aye-ayes-ear">aye-ayes-ear</option>
                </select>
            </div>
        </div>
        <div class="status-indicator">
            <div class="status-row">
                <div class="status-dot idle" id="status-dot"></div>
                <span class="status-text" id="status-text">idle</span>
            </div>
        </div>
    </aside>

    <header class="topbar">
        <span class="topbar-title">stream control</span>
    </header>

    <main class="main">
        <div class="actions-row">
            <button class="action-btn primary" id="start-btn">▶ start</button>
            <button class="action-btn secondary" id="agendas-btn">view agendas</button>
        </div>

        <div class="result-panel" id="start-panel">
            <div class="panel-header">
                <span class="panel-title">start result</span>
                <span class="panel-badge pending" id="start-badge" style="display:none"></span>
            </div>
            <div class="panel-body" id="start-body">
                <div class="panel-empty">no result yet</div>
            </div>
        </div>

        <div class="result-panel" id="agendas-panel">
            <div class="panel-header">
                <span class="panel-title">agendas</span>
                <span class="panel-badge pending" id="agendas-badge" style="display:none"></span>
            </div>
            <div class="panel-body" id="agendas-body">
                <div class="panel-empty">no result yet</div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
    const startBtn = document.getElementById('start-btn');
    const agendasBtn = document.getElementById('agendas-btn');
    const startBody = document.getElementById('start-body');
    const agendasBody = document.getElementById('agendas-body');
    const startBadge = document.getElementById('start-badge');
    const agendasBadge = document.getElementById('agendas-badge');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    let currentData = null;

    function setStatus(s, label) {
        statusDot.className = 'status-dot ' + s;
        statusText.textContent = label || s;
    }

    function showLoading(bodyEl, badgeEl) {
        badgeEl.style.display = '';
        badgeEl.className = 'panel-badge pending';
        badgeEl.textContent = 'pending';
        bodyEl.innerHTML = '<div class="loading-text"><span class="spinner"></span>fetching</div>';
    }

    function showResult(bodyEl, badgeEl, data, ok) {
        badgeEl.style.display = '';
        badgeEl.className = 'panel-badge ' + (ok ? 'ok' : 'err');
        badgeEl.textContent = ok ? 'ok' : 'error';
        bodyEl.innerHTML = `<pre class="json-code">${esc(JSON.stringify(data, null, 2))}</pre>`;
        gsap.from(bodyEl.querySelector('pre'), { opacity: 0, y: 10, duration: 0.3 });
    }

    function showError(bodyEl, badgeEl, msg) {
        badgeEl.style.display = '';
        badgeEl.className = 'panel-badge err';
        badgeEl.textContent = 'error';
        bodyEl.innerHTML = `<pre class="json-code" style="color:var(--accent3)">${esc(msg)}</pre>`;
    }

    function esc(str) {
        const d = document.createElement('div');
        d.textContent = String(str);
        return d.innerHTML;
    }

    function formatDuration(seconds) {
        const hours = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        if (hours > 0) return `${hours}h ${mins}m`;
        return `${mins}m`;
    }

    function formatTime(datetime) {
        return new Date(datetime).toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }

    function getSceneType(title) {
        const lower = title.toLowerCase();
        if (lower.includes('news')) return 'news';
        if (lower.includes('weather')) return 'weather';
        if (lower.includes('greeting') || lower.includes('bye')) return 'greeting';
        return 'music';
    }

    function renderAgenda(data) {
        currentData = data;
        const brand = Object.keys(data)[0];
        const agenda = data[brand];

        const totalDuration = agenda.scenes.reduce((acc, s) => acc + s.durationSeconds, 0);
        const totalSongs = agenda.scenes.reduce((acc, s) => acc + s.totalSongs, 0);

        let html = `
            <div class="agenda-header">
                <div class="agenda-stats">
                    <div class="stat-box">
                        <span class="stat-label">Brand</span>
                        <span class="stat-value">${esc(brand)}</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Scenes</span>
                        <span class="stat-value">${agenda.totalScenes}</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Duration</span>
                        <span class="stat-value">${formatDuration(totalDuration)}</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Songs</span>
                        <span class="stat-value">${totalSongs}</span>
                    </div>
                </div>
            </div>
            <div class="scenes-list">
        `;

        agenda.scenes.forEach((scene, index) => {
            const type = getSceneType(scene.title);
            const sceneJson = JSON.stringify(scene, null, 2);

            html += `
                <div class="scene-card" data-index="${index}">
                    <div class="scene-row">
                        <span class="scene-time">${formatTime(scene.scheduledStartTime)}</span>
                        <span class="scene-type-badge ${type}">${type}</span>
                        <span class="scene-title">${esc(scene.title)}</span>
                        <span class="scene-duration">${formatDuration(scene.durationSeconds)}</span>
                        <span class="scene-songs">${scene.totalSongs} songs</span>
                        <span class="chevron-cell">›</span>
                    </div>
                    <div class="scene-payload" id="scene-payload-${index}">
                        <div class="payload-inner">
                            <div class="payload-meta">
                                <div class="meta-pair">
                                    <span class="meta-key">scene id</span>
                                    <span class="meta-val">${esc(scene.id)}</span>
                                </div>
                                <div class="meta-pair">
                                    <span class="meta-key">duration</span>
                                    <span class="meta-val">${scene.durationSeconds}s</span>
                                </div>
                                <div class="meta-pair">
                                    <span class="meta-key">songs</span>
                                    <span class="meta-val">${scene.totalSongs}</span>
                                </div>
                                <div class="meta-pair">
                                    <span class="meta-key">start time</span>
                                    <span class="meta-val">${esc(scene.scheduledStartTime)}</span>
                                </div>
                            </div>
                            <div class="payload-json-wrap">
                                <pre class="payload-json">${esc(sceneJson)}</pre>
                                <button class="copy-btn" onclick="copySceneJson(this, '${esc(sceneJson.replace(/'/g, "\\'"))}')">copy</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        // Full JSON dump expandable section
        const fullJson = JSON.stringify(data, null, 2);
        html += `
            <div class="json-dump-section" id="json-dump-section">
                <div class="json-dump-header" id="json-dump-header">
                    <span class="json-dump-title">📋 full json dump</span>
                    <span class="json-dump-chevron">›</span>
                </div>
                <div class="json-dump-body" id="json-dump-body">
                    <div class="json-dump-inner">
                        <div class="payload-json-wrap">
                            <pre class="json-code" id="full-json-code">${esc(fullJson)}</pre>
                            <button class="copy-btn" onclick="copyFullJson()">copy all</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        return html;
    }

    function toggleSceneCard(card, index) {
        const payloadEl = document.getElementById('scene-payload-' + index);
        const isOpen = card.classList.contains('expanded');

        if (isOpen) {
            gsap.to(payloadEl, {
                height: 0,
                duration: 0.3,
                ease: 'power2.inOut',
                onComplete: () => payloadEl.classList.remove('open')
            });
            card.classList.remove('expanded');
        } else {
            payloadEl.classList.add('open');
            const naturalH = payloadEl.scrollHeight;
            gsap.fromTo(payloadEl,
                { height: 0 },
                { height: naturalH, duration: 0.35, ease: 'power2.out', onComplete: () => gsap.set(payloadEl, { height: 'auto' }) }
            );
            gsap.fromTo(payloadEl.querySelectorAll('.meta-pair, .payload-json-wrap'),
                { opacity: 0, y: 8 },
                { opacity: 1, y: 0, duration: 0.25, stagger: 0.04 }
            );
            card.classList.add('expanded');
        }
    }

    function toggleJsonDump() {
        const section = document.getElementById('json-dump-section');
        const body = document.getElementById('json-dump-body');
        const isOpen = section.classList.contains('expanded');

        if (isOpen) {
            gsap.to(body, {
                height: 0,
                duration: 0.3,
                ease: 'power2.inOut',
                onComplete: () => {
                    body.classList.remove('open');
                    section.classList.remove('expanded');
                }
            });
        } else {
            section.classList.add('expanded');
            body.classList.add('open');
            const naturalH = body.scrollHeight;
            gsap.fromTo(body,
                { height: 0 },
                { height: naturalH, duration: 0.35, ease: 'power2.out', onComplete: () => gsap.set(body, { height: 'auto' }) }
            );
            gsap.fromTo(body.querySelector('.json-dump-inner'),
                { opacity: 0, y: 8 },
                { opacity: 1, y: 0, duration: 0.25 }
            );
        }
    }

    function copySceneJson(btn, json) {
        navigator.clipboard.writeText(json).then(() => {
            const orig = btn.textContent;
            btn.textContent = 'copied';
            setTimeout(() => btn.textContent = orig, 1800);
        }).catch(() => {
            btn.textContent = 'failed';
            setTimeout(() => btn.textContent = 'copy', 1800);
        });
    }

    function copyFullJson() {
        if (!currentData) return;
        const json = JSON.stringify(currentData, null, 2);
        navigator.clipboard.writeText(json).then(() => {
            const btn = document.querySelector('#json-dump-body .copy-btn');
            const orig = btn.textContent;
            btn.textContent = 'copied';
            setTimeout(() => btn.textContent = orig, 1800);
        }).catch(() => {
            const btn = document.querySelector('#json-dump-body .copy-btn');
            btn.textContent = 'failed';
            setTimeout(() => btn.textContent = 'copy all', 1800);
        });
    }

    startBtn.addEventListener('click', async () => {
        const brand = document.getElementById('brand').value;
        setStatus('running', 'running');
        startBtn.disabled = true;
        showLoading(startBody, startBadge);

        try {
            const res = await fetch(`/jesoos/${brand}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json();
            showResult(startBody, startBadge, data, res.ok);
            setStatus(res.ok ? 'running' : 'error', res.ok ? 'running' : 'error');
        } catch (err) {
            showError(startBody, startBadge, err.message);
            setStatus('error', 'error');
        } finally {
            startBtn.disabled = false;
        }
    });

    agendasBtn.addEventListener('click', async () => {
        showLoading(agendasBody, agendasBadge);

        try {
            const res = await fetch('/jesoos/agendas');
            const data = await res.json();

            agendasBadge.style.display = '';
            agendasBadge.className = 'panel-badge ' + (res.ok ? 'ok' : 'err');
            agendasBadge.textContent = res.ok ? 'ok' : 'error';

            agendasBody.innerHTML = renderAgenda(data);

            gsap.from('.agenda-header', { opacity: 0, y: -10, duration: 0.3 });
            gsap.from('.scene-card', {
                opacity: 0,
                y: 20,
                duration: 0.3,
                stagger: 0.03,
                ease: 'power2.out'
            });
            gsap.from('.json-dump-section', { opacity: 0, y: 10, duration: 0.3, delay: 0.5 });

            // Add click handlers to scene cards
            document.querySelectorAll('.scene-card').forEach((card) => {
                const index = card.dataset.index;
                card.querySelector('.scene-row').addEventListener('click', () => toggleSceneCard(card, index));
            });

            // Add click handler to JSON dump header
            document.getElementById('json-dump-header').addEventListener('click', toggleJsonDump);

        } catch (err) {
            showError(agendasBody, agendasBadge, err.message);
        }
    });
</script>
</body>
</html>
